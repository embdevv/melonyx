name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install C++ compiler and build tools
        run: |
          sudo apt-get install -y build-essential g++ git

      - name: Install OpenGL development libraries
        run: |
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libx11-xcb-dev libxrandr-dev libxi-dev

      - name: Create build directory
        run: mkdir -p build-linux

      - name: Configure CMake
        working-directory: build-linux
        run: cmake ..

      - name: Build project
        working-directory: build-linux
        run: cmake --build .
